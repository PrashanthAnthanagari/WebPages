<html>

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="shop_smart.css">
</head>

<body>
    <div class="app-container">
        <div class="nav-bar">
            <div><img src="/images/logo.jpg" alt="">
            </div>
            <ul class="navbar-list">
                <li>Home</li>
                <li>Shop</li>
                <li>Collections</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
            <div class="nav-logo">
                <div class="icon-item">
                    <i class="fa-solid fa-user"></i>
                    <span>Login</span>
                </div>

                <div class="icon-item">
                    <i class="fa-regular fa-heart"></i>
                    <span>Wishlist</span>
                </div>

                <div class="icon-item">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Cart(2)</span>
                </div>
            </div>
        </div>
        <div class="two-sections">
            <div class="hero-section">
                <div class="hero-main">
                    <h1 class="hero-heading">Shop the <br><span class="hero-heading1">Latest Trends</span></h1>
                    <p class="hero-para">Discover Your Style with Our New Arrivals</p>
                    <div class="buttons">
                        <button class="hero-button1">Shop Now</button>
                        <button class="hero-button2">View Collections</button>
                    </div>
                </div>
            </div>
            <div class="test-monials">
                <div class="image1">
                    <img src="/images/free-shipping.jpg" alt="">
                    <div class="test-heading">
                        <h3>Free Shipping</h3>
                        <p>On Orders Over $50</p>
                    </div>
                </div>
                <div class="image1">
                    <img src="/images/support24.jpg" alt="">
                    <div class="test-heading">
                        <h3>24/7 Support</h3>
                        <p>We're Here to Help</p>
                    </div>
                </div>
                <div class="image1">
                    <img src="/images/checkout1.jpg" alt="">
                    <div class="test-heading">
                        <h3>Secure Checkout</h3>
                        <p>Safe & Secure Payments</p>
                    </div>
                </div>

            </div>
        </div>
        <div class="footer"></div>
    </div>
</body>

</html>
